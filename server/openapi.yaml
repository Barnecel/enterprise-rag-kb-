openapi: 3.0.0
info:
  title: 企业知识库 RAG 问答系统 API
  description: 基于 Flask 的企业知识库智能问答系统，支持混合检索、多模型热插拔、权限控制和评测驱动
  version: 1.0.0
  contact:
    name: RAG System Team
servers:
  - url: http://localhost:5003
    description: 本地开发服务器
paths:
  /api/health:
    get:
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 服务运行正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /api/auth/login:
    post:
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
      responses:
        '200':
          description: 登录成功，返回 JWT 令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        '400':
          description: 参数错误
        '401':
          description: 用户名或密码错误
  /api/auth/logout:
    post:
      summary: 用户登出
      operationId: logout
      security:
        - Bearer: []
      responses:
        '200':
          description: 登出成功
  /api/auth/register:
    post:
      summary: 用户注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                real_name:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: 注册成功
  /api/auth/verify:
    get:
      summary: 验证令牌有效性
      operationId: verify
      security:
        - Bearer: []
      responses:
        '200':
          description: 令牌有效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code
                  data:
                    type: object
                    properties:
                      user_id
                      username
                      role
  /api/auth/change_password:
    post:
      summary: 修改密码
      operationId: changePassword
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: 密码修改成功
  /api/user/profile:
    get:
      summary: 获取用户profile
      operationId: getProfile
      security:
        - Bearer: []
      responses:
        '200':
          description: 用户信息
  /api/user/list:
    get:
      summary: 获取用户列表
      operationId: listUsers
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 10}
      responses:
        '200':
          description: 用户列表
  /api/user/tenants:
    get:
      summary: 获取用户可访问的租户
      operationId: listTenants
      security:
        - Bearer: []
      responses:
        '200':
          description: 租户列表
  /api/user/<int:user_id>:
    put:
      summary: 更新用户信息
      operationId: updateUser
      security:
        - Bearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: integer}
        - name: body
          in: body
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string}
                  real_name: {type: string}
                  email: {type: string}
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 删除用户
      operationId: deleteUser
      security:
        - Bearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 删除成功
  /api/category:
    post:
      summary: 创建文档类别
      operationId: createCategory
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        '200':
          description: 创建成功
    get:
      summary: 获取类别列表
      operationId: listCategories
      security:
        - Bearer: []
      responses:
        '200':
          description: 类别列表
  /api/category/<int:category_id>:
    put:
      summary: 更新类别
      operationId: updateCategory
      security:
        - Bearer: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 删除类别
      operationId: deleteCategory
      security:
        - Bearer: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 删除成功
  /api/document/<int:doc_id>:
    get:
      summary: 获取文档详情
      operationId: getDocument
      security:
        - Bearer: []
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 文档详情
    delete:
      summary: 删除文档
      operationId: deleteDocument
      security:
        - Bearer: []
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 删除成功
  /api/document/list:
    get:
      summary: 获取文档列表
      operationId: listDocuments
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 10}
        - name: keyword
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 文档列表
  /api/document/upload:
    post:
      summary: 上传文档
      operationId: uploadDocument
      security:
        - Bearer: []
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
            category:
              type: string
              description: 关联的类别名称
      responses:
        '200':
          description: 上传成功
  /api/document/parsed/<int:doc_id>:
    get:
      summary: 获取已解析文档内容
      operationId: getParsedDocument
      security:
        - Bearer: []
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 已解析内容
  /api/search:
    get:
      summary: 检索文档
      operationId: searchDocuments
      security:
        - Bearer: []
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, description: 检索关键词}
        - name: top_k
          in: query
          required: false
          schema: {type: integer, default: 5}
        - name: tenant_id
          in: query
          required: false
          schema: {type: integer}
        - name: clearance_level
          in: query
          required: false
          schema: {type: integer}
      responses:
        '200':
          description: 检索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        title: {type: string}
                        content: {type: string}
                        score: {type: number}
  /api/qa/ask:
    post:
      summary: 问答（非流式）
      operationId: askQuestion
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  description: 用户问题
                conversation_id:
                  type: string
                  description: 会话ID（可选）
      responses:
        '200':
          description: 回答结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code
                  message
                  data:
                    type: object
                    properties:
                      answer: {type: string}
                      source_documents: {type: array}
                      conversation_id: {type: string}
  /api/qa/ask/stream:
    post:
      summary: 问答（流式返回）
      operationId: askQuestionStream
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                conversation_id:
                  type: string
      responses:
        '200':
          description: 流式回答
          content:
            text/event-stream:
              schema:
                type: string
  /api/qa/history:
    get:
      summary: 获取问答历史
      operationId: getHistory
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 10}
      responses:
        '200':
          description: 历史记录
  /api/qa/history/<int:history_id>:
    get:
      summary: 获取单条问答详情
      operationId: getHistoryDetail
      security:
        - Bearer: []
      parameters:
        - name: history_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 问答详情
  /api/qa/feedback:
    post:
      summary: 提交反馈
      operationId: submitFeedback
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                history_id: {type: integer}
                rating: {type: integer, enum: [1, -1]}
                reason: {type: string}
      responses:
        '200':
          description: 反馈成功
  /api/qa/feedback/stats:
    get:
      summary: 获取反馈统计
      operationId: feedbackStats
      security:
        - Bearer: []
      responses:
        '200':
          description: 统计结果
  /api/qa/feedback/to_golden:
    post:
      summary: 差评转为golden标准
      operationId: feedbackToGolden
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                history_ids:
                  type: array
                  items: {type: integer}
      responses:
        '200':
          description: 转换结果
  /api/admin/dashboard:
    get:
      summary: 管理员 dashboard
      operationId: adminDashboard
      security:
        - Bearer: []
      responses:
        '200':
          description: dashboard 数据
  /api/admin/login_logs:
    get:
      summary: 获取登录日志
      operationId: loginLogs
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer}
        - name: limit
          in: query
          required: false
          schema: {type: integer}
      responses:
        '200':
          description: 日志列表
  /api/admin/metrics:
    get:
      summary: 获取系统指标
      operationId: metrics
      security:
        - Bearer: []
      responses:
        '200':
          description: 指标数据
  /api/admin/statistics/category:
    get:
      summary: 分类统计
      operationId: statsCategory
      security:
        - Bearer: []
      responses:
        '200':
          description: 统计数据
  /api/admin/statistics/daily:
    get:
      summary: 每日统计
      operationId: statsDaily
      security:
        - Bearer: []
      responses:
        '200':
          description: 统计数据
  /api/admin/statistics/token_usage:
    get:
      summary: Token 使用统计
      operationId: statsTokenUsage
      security:
        - Bearer: []
      responses:
        '200':
          description: Token 使用数据
  /api/admin/statistics/user_activity:
    get:
      summary: 用户活动统计
      operationId: statsUserActivity
      security:
        - Bearer: []
      responses:
        '200':
          description: 活动数据
  /api/model:
    post:
      summary: 模型热切换
      operationId: swapModel
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_type, model_name]
              properties:
                model_type:
                  type: string
                  enum: [llm, embedding]
                model_name:
                  type: string
                api_base:
                  type: string
                api_key:
                  type: string
      responses:
        '200':
          description: 切换结果
    get:
      summary: 获取当前激活模型
      operationId: getActiveModel
      security:
        - Bearer: []
      responses:
        '200':
          description: 激活模型信息
  /api/model/<int:model_id>:
    put:
      summary: 更新模型配置
      operationId: updateModel
      security:
        - Bearer: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model_name: {type: string}
                api_base: {type: string}
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 卸载模型
      operationId: deleteModel
      security:
        - Bearer: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 卸载成功
  /api/model/active:
    get:
      summary: 获取当前激活模型
      operationId: getActiveModel
      security:
        - Bearer: []
      responses:
        '200':
          description: 激活模型
  /api/model/list:
    get:
      summary: 获取模型列表
      operationId: listModels
      security:
        - Bearer: []
      responses:
        '200':
          description: 模型列表
  /api/model/rebuild_status:
    get:
      summary: 获取重建状态
      operationId: rebuildStatus
      security:
        - Bearer: []
      responses:
        '200':
          description: 重建状态
  /api/model/rebuild_vectors:
    post:
      summary: 重建向量索引
      operationId: rebuildVectors
      security:
        - Bearer: []
      responses:
        '200':
          description: 重建结果
  /api/category/list:
    get:
      summary: 获取类别列表(简化版)
      operationId: listCategoriesSimple
      security:
        - Bearer: []
      responses:
        '200':
          description: 类别列表
/static/<path:filename>:
  get:
    summary: 静态资源访问
    operationId: serveStatic
    responses:
      '200':
        description: 静态文件
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        error:
          type: integer
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          default: 200
        message:
          type: string
        data:
          type: object
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    DocumentInfo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category: {type: string}
        upload_time:
          type: string
          format: date-time
        status: {type: string}
    QAHistory:
      type: object
      properties:
        id:
          type: integer
        question: {type: string}
        answer: {type: string}
        created_at: {type: string}
        model_used: {type: string}
    FeedbackStats:
      type: object
      properties:
        likes:
          type: integer
        dislikes:
          type: integer
        total:
          type: integer
    ModelConfig:
      type: object
      properties:
        model_type: {type: string}
        model_name: {type: string}
        api_base: {type: string}
        is_active: {type: boolean}
security:
  - Bearer: []
tags:
  - auth: 用户认证
  - user: 用户管理
  - category: 文档分类
  - document: 文档管理
  - search: 检索
  - qa: 问答
  - admin: 管理员
  - model: 模型管理
tags:
  - name: auth
    description: 用户认证相关接口
  - name: user
    description: 用户管理相关接口
  - name: category
    description: 文档分类管理接口
  - name: document
    description: 文档管理接口
  - name: search
    description: 检索接口
  - name: qa
    description: 问答接口
  - name: admin
    description: 管理员接口
  - name: model
    description: 模型热插拔接口
```

